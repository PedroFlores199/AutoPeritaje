[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="auto-peritaje"
version="1.0.0"
description="Segmentación de daños y piezas de vehículos con inferencia ONNX en CPU"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn>=0.30,<1","python-multipart>=0.0.20,<1","pillow>=11,<13","numpy>=2,<3","onnxruntime>=1.22,<2","opencv-python-headless>=4.11,<5","httpx>=0.28,<1","reportlab>=4.4,<5"]
[project.optional-dependencies]
training=["ultralytics==8.4.214","torch>=2.8,<3","onnx>=1.18,<2","pyyaml>=6,<7","matplotlib>=3.9,<4","huggingface-hub>=1,<2"]
test=["pytest>=8"]
pricing=["pandas==2.3.3","scikit-learn==1.9.1","xgboost==3.4.1","lightgbm==4.7.0","shap==0.54.1","joblib>=1.4,<2","filelock>=3,<4","prometheus-client>=0.21,<1"]
[tool.hatch.build.targets.wheel]
packages=["peritaje"]
[tool.pytest.ini_options]
testpaths=["tests"]
asyncio_default_fixture_loop_scope="function"
